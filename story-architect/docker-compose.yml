services:
  db:
    image: pgvector/pgvector:pg16
    container_name: story-architect-db
    environment:
      POSTGRES_USER: story
      POSTGRES_PASSWORD: story
      POSTGRES_DB: story_architect
    ports: ["5432:5432"]
    volumes: ["db-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U story -d story_architect"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  db-data:
